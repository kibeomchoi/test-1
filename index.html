<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시험기간 생존 계산기</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 400px;
      background: rgba(255,255,255,0.05);
      padding: 35px;
      border-radius: 25px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .input-box {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #374151;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #6366f1;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.03);
      background: #4f46e5;
    }

    .result-card {
      margin-top: 25px;
      padding: 20px;
      background: rgba(255,255,255,0.07);
      border-radius: 16px;
      line-height: 1.8;
      text-align: center;
      font-size: 17px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>📚 시험기간 생존 계산기</h1>
  <p class="subtitle">현실을 알려드립니다</p>

  <div class="input-box">
    <label>시험 날짜</label>
    <input type="date" id="examDate">
  </div>

  <div class="input-box">
    <label>하루 공부 가능 시간</label>
    <input type="number" id="studyTime" placeholder="예: 5">
  </div>

  <div class="input-box">
    <label>목표 등급 (1~9)</label>
    <input type="number" id="goal" min="1" max="9" placeholder="예: 2">
  </div>

  <button onclick="calculate()">계산하기</button>

  <div class="result-card" id="result">
    결과가 여기 표시됩니다.
  </div>
</div>

<script>
  function calculate() {
    const examDateValue = document.getElementById("examDate").value;
    const studyTime = Number(document.getElementById("studyTime").value);
    const goal = Number(document.getElementById("goal").value);
    const result = document.getElementById("result");

    if (!examDateValue || !studyTime || !goal) {
      result.innerHTML = "⚠️ 입력 좀 다 해라";
      return;
    }

    const today = new Date();
    const examDate = new Date(examDateValue);

    const diffTime = examDate - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays <= 0) {
      result.innerHTML = "💀 시험 이미 끝났는데?";
      return;
    }

    let recommendedTime;
    let comment;

    if (goal <= 2) {
      recommendedTime = 8;
      comment = "님 꽤 독한 놈이네";
    } else if (goal <= 4) {
      recommendedTime = 6;
      comment = "아직 인간의 영역";
    } else {
      recommendedTime = 4;
      comment = "행복 공부 ㄱ";
    }

    let status;

    if (studyTime >= recommendedTime) {
      status = "🔥 가능성 있음";
    } else if (studyTime >= recommendedTime - 2) {
      status = "😅 살짝 불안함";
    } else {
      status = "🚨 지금 유튜브 삭제할 타이밍";
    }

    result.innerHTML = `
      📅 시험까지 <b>${diffDays}일</b> 남음<br>
      📚 추천 공부 시간: <b>하루 ${recommendedTime}시간</b><br>
      ⏰ 현재 가능 시간: <b>${studyTime}시간</b><br><br>

      ${status}<br>
      💬 ${comment}
    `;
  }
</script>

</body>
</html>
